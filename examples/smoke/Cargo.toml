[package]
name = "tower-worker-fetch-smoke"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tower-worker-fetch = { path = "../.." }

worker = { version = "0.8.7", features = ["http"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
futures-util = { version = "0.3", default-features = false }
web-sys = { version = "0.3", features = ["AbortSignal", "Request"] }
