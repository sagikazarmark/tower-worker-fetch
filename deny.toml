[graph]
all-features = true

[licenses]
allow = [
  "Apache-2.0",
  "MIT",

  "Unicode-3.0",
  "BSD-3-Clause",
  "ISC",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
  # `worker` depends on chrono unconditionally, so it cannot be dropped from here.
  # https://github.com/cloudflare/workers-rs/issues/77
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; a required dependency of worker" },
]
